name: Publish Kodi Repository

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write  # create the GitHub release and attach the zips
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read addon version
        id: addon
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c "import xml.etree.ElementTree as t; print(t.parse('addon.xml').getroot().get('version') or '')")"
          if [[ -z "${version}" ]]; then
            echo "Failed to read version from addon.xml" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Validate tag matches addon.xml version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${{ steps.addon.outputs.version }}"
          expected="v${version}"
          if [[ "${tag}" != "${expected}" ]]; then
            echo "Tag (${tag}) must match addon.xml version (${version}). Expected ${expected}." >&2
            exit 1
          fi

      - name: Build zip
        shell: bash
        run: |
          set -euo pipefail
          bash package.sh
          ls -lah dist

      - name: Build Kodi repository
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check markdown
          python3 scripts/build_kodi_repo.py
          find dist/kodi-repo -maxdepth 5 -type f -print

      - name: Attach zips to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            dist/service.subtitles.chinesesubtitles-*.zip
            dist/kodi-repo/repo/zips/repository.chinesesubtitles/repository.chinesesubtitles-*.zip

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/kodi-repo

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
